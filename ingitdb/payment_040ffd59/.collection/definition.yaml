record_file:
  name: records.json
  format: json
  type: "map[$record_id]map[$field_name]any"
primary_key: ["payment_id"]
columns:
  "payment_id":
    type: int
    required: true
  "customer_id":
    type: int
    required: true
  "staff_id":
    type: int
    required: true
  "rental_id":
    type: int
  "amount":
    type: any
    required: true
  "payment_date":
    type: string
    required: true
  "last_update":
    type: string
