record_file:
  name: records.json
  format: json
  type: "map[$record_id]map[$field_name]any"
primary_key: ["film_id"]
columns:
  "film_id":
    type: int
    required: true
  "title":
    type: string
    required: true
  "description":
    type: string
  "release_year":
    type: string
  "language_id":
    type: int
    required: true
  "original_language_id":
    type: any
  "rental_duration":
    type: int
    required: true
  "rental_rate":
    type: float
    required: true
  "length":
    type: int
  "replacement_cost":
    type: float
    required: true
  "rating":
    type: string
  "special_features":
    type: string
  "last_update":
    type: string
    required: true
