record_file:
  name: records.json
  format: json
  type: "map[$record_id]map[$field_name]any"
primary_key: ["customer_id"]
columns:
  "customer_id":
    type: int
    required: true
  "store_id":
    type: int
    required: true
  "first_name":
    type: string
    required: true
  "last_name":
    type: string
    required: true
  "email":
    type: string
  "address_id":
    type: int
    required: true
  "active":
    type: int
    required: true
  "create_date":
    type: string
    required: true
  "last_update":
    type: string
